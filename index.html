<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device test</title>

<style>
  body { max-width: 800px; margin: 2rem auto; padding: 0 1rem; font: 16px/1.5 system-ui; }
  input, button { padding: 0.5rem; font: inherit; }
  .detected { color: #b00020; font-weight: bold; }
  pre { padding: 1rem; background: #f4f4f4; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>

<h1>Device test</h1>
<form id="test">
  <label>Server API key
    <input id="key" type="password" required autocomplete="off">
  </label>
  <button id="run">Run test</button>
</form>

<p id="status" role="status"></p>
<div id="signals"></div>
<h2>Full API response</h2>
<pre id="output">Run a test to see the response.</pre>

<script type="module">
  const publicKey = "OR6jwIaMdRKmrRoiJT03";
  const status = document.querySelector("#status");
  const signals = document.querySelector("#signals");
  const output = document.querySelector("#output");
  const run = document.querySelector("#run");

  function showSignal(label, value) {
    const line = document.createElement("div");
    if (value === true) {
      line.className = "detected";
      line.textContent = `${label} detected`;
    } else if (value === false) {
      line.textContent = `${label}: Not detected`;
    } else {
      line.textContent = `${label}: Result unavailable`;
    }
    signals.append(line);
  }

  document.querySelector("#test").addEventListener("submit", async (e) => {
    e.preventDefault();
    const keyInput = document.querySelector("#key");
    const secretKey = keyInput.value.trim();
    if (!secretKey) return;

    run.disabled = true;
    signals.replaceChildren();
    output.textContent = "";
    status.textContent = "Checking browser…";
    let eventId;

    try {
      const Fingerprint = await import(
        `https://fpjscdn.net/v4/${encodeURIComponent(publicKey)}`
      );
      const agent = await Fingerprint.start();
      const result = await agent.get();
      eventId = result.event_id;
      status.textContent = `Loading event ${eventId}…`;

      const response = await fetch(
        `https://api.fpjs.io/v4/events/${encodeURIComponent(eventId)}`,
        { headers: { Authorization: `Bearer ${secretKey}` }, cache: "no-store" }
      );

      const raw = await response.text();
      output.textContent = raw;
      if (!response.ok) throw new Error(`Server API returned HTTP ${response.status}`);

      const event = JSON.parse(raw);
      showSignal("VPN", event.vpn);
      showSignal("Virtual machine", event.virtual_machine);
      output.textContent = JSON.stringify(event, null, 2);
      status.textContent = `Event ID: ${eventId}`;
    } catch (error) {
      status.textContent = eventId
        ? `Event ${eventId} was recorded. Could not read the server response: ${error.message}`
        : `Browser check failed: ${error.message}`;
      if (!output.textContent) output.textContent = "No API response available.";
    } finally {
      keyInput.value = "";
      run.disabled = false;
    }
  });
</script>
</html>
